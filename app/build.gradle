plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exemplo.projeto1'
    compileSdk 33

    defaultConfig {
        applicationId 'com.exemplo.projeto1'
        minSdk 16
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
